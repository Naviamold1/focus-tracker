[project]
name = "focus-tracker"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ilia Arkania", email = "89490126+Naviamold1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cv2-enumerate-cameras>=1.4.0",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.4.0",
    "keyboard>=0.13.5",
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python>=5.0.0.93",
    "pyside6-essentials>=6.12.0",
    "python-dotenv>=1.2.4",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pywin32>=312 ; sys_platform == 'win32'",
    "tokenizers>=0.23.3",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
